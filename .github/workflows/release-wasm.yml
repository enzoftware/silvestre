name: Release WebAssembly Package

on:
  push:
    tags:
      - 'wasm-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish to npm or create release)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release silvestre-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@82a92a6e8fbeee08c636a485ce80808d77cbe4a4 # v2.7.8
        with:
          key: wasm-release

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Build WebAssembly bundler package
        working-directory: silvestre-wasm
        run: wasm-pack build --target bundler --out-dir pkg

      - name: Validate tag version matches package.json
        if: startsWith(github.ref, 'refs/tags/wasm-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#wasm-v}"
          PKG_VERSION=$(jq -r '.version' silvestre-wasm/pkg/package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify npm package (dry-run)
        working-directory: silvestre-wasm/pkg
        run: npm publish --dry-run

      - name: Publish to npm
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wasm-v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        working-directory: silvestre-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wasm-v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        uses: softprops/action-gh-release@c062e08bd53287ba072042f618b096e7025874a2 # v2.2.1
        with:
          generate_release_notes: true
          files: |
            silvestre-wasm/README.md
            LICENSE
