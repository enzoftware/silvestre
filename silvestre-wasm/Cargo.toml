[package]
name = "silvestre-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/enzoftware/silvestre"
documentation = "https://github.com/enzoftware/silvestre/tree/main/silvestre-wasm"
readme = "README.md"
description = "High-performance WebAssembly image processing library powered by Rust."
keywords = ["image-processing", "wasm", "webassembly", "filters", "rust"]
categories = ["multimedia::images", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
silvestre-core = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }

[dependencies.web-sys]
workspace = true
features = ["ImageData"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
