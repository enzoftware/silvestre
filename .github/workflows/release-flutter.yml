name: Release Flutter Package

on:
  push:
    tags:
      - 'flutter-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish to pub.dev or create release)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-flutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate & Release silvestre_flutter
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@82a92a6e8fbeee08c636a485ce80808d77cbe4a4 # v2.7.8
        with:
          key: flutter-release

      - name: Build the Rust bridge crate
        run: cargo build -p silvestre_flutter_rust --verbose

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate tag version matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/flutter-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#flutter-v}"
          PUBSPEC_VERSION=$(grep '^version:' silvestre_flutter/pubspec.yaml | awk '{print $2}')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Resolve plugin dependencies
        working-directory: silvestre_flutter
        run: flutter pub get

      - name: Analyze plugin
        working-directory: silvestre_flutter
        run: flutter analyze

      - name: Resolve example dependencies
        working-directory: silvestre_flutter/example
        run: flutter pub get

      - name: Run tests
        working-directory: silvestre_flutter/example
        run: flutter test

      - name: Verify pub.dev package (dry-run)
        working-directory: silvestre_flutter
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/flutter-v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        working-directory: silvestre_flutter
        run: dart pub publish --force

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/flutter-v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        uses: softprops/action-gh-release@c062e08bd53287ba072042f618b096e7025874a2 # v2.2.1
        with:
          generate_release_notes: true
          files: |
            silvestre_flutter/CHANGELOG.md
            LICENSE
